name: Documentation issue
description: Report incorrect instructions, missing explanations, or a website problem.
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        Include public source links and a minimal example. Do not attach private conversations, credentials, exports, or local databases. Follow SECURITY.md for sensitive security reports.
  - type: input
    id: page
    attributes:
      label: Page or guide
      description: Link to the affected page or name the Markdown file.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is incorrect, missing, or difficult to use?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected documentation or behavior
      description: Include relevant public source references or steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment, if relevant
      description: Browser and operating system for website problems; source commit or release for application instructions.
